# Configuration des tests d'integration (profil "test")
# Base de donnees : stock_pharmacie_dev mais avec un SCHEMA dedie "it"
# afin d'isoler totalement les donnees du profil de developpement (schema public).
server.port=0

spring.datasource.url=jdbc:postgresql://localhost:5432/stock_pharmacie_dev?currentSchema=it,public
spring.datasource.username=${DB_DEV_USERNAME:dev_user}
spring.datasource.password=${DB_DEV_PASSWORD:dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway applique les migrations dans le schema "it"
spring.flyway.enabled=true
spring.flyway.schemas=it
spring.flyway.default-schema=it

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Les comptes de demonstration restent actifs et le changement de mot de passe
# admin n'est pas declenche pendant les tests d'integration.
spring.flyway.placeholders.admin_must_change_password=false

# Tests sans cache de templates
spring.thymeleaf.cache=false

# Logs discrets pendant les tests
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.com.pharmacy.stock=WARN
