# Configuration Développement
server.port=8080

# Base de données PostgreSQL Dev
spring.datasource.url=jdbc:postgresql://localhost:5432/stock_pharmacie_dev
spring.datasource.username=${DB_DEV_USERNAME:dev_user}
spring.datasource.password=${DB_DEV_PASSWORD:dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Console H2 optionnelle (désactivée si utilisation PostgreSQL)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# JPA/Hibernate - Logs verbeux
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.use_sql_comments=true

# Thymeleaf - Désactivé en cache pour le développement
spring.thymeleaf.cache=false

# Logging verbeux
logging.level.root=INFO
logging.level.com.pharmacy.stock=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.flywaydb=INFO

# DevTools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
