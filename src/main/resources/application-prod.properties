# Configuration Production
server.port=${SERVER_PORT:8443}

# SSL Configuration
server.ssl.enabled=${SSL_ENABLED:true}
server.ssl.key-store=${SSL_KEYSTORE_PATH:/etc/ssl/certs/keystore.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-store-type=${SSL_KEYSTORE_TYPE:PKCS12}
server.ssl.key-alias=${SSL_KEY_ALIAS:tomcat}

# Base de données PostgreSQL Production (via variables d'environnement)
spring.datasource.url=${DB_PROD_URL}
spring.datasource.username=${DB_PROD_USERNAME}
spring.datasource.password=${DB_PROD_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP - Pool de connexions optimisé pour la production
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:10}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:300000}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:20000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1200000}
spring.datasource.hikari.leak-detection-threshold=${HIKARI_LEAK_DETECTION_THRESHOLD:60000}
spring.datasource.hikari.pool-name=PharmacyStockHikariCP

# JPA/Hibernate - Production
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Thymeleaf - Cache activé en production
spring.thymeleaf.cache=true

# Flyway
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true

# Logging - Production (moins verbeux)
logging.level.root=WARN
logging.level.com.pharmacy.stock=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO

# Sécurité supplémentaire
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Cookie de session : HTTPS uniquement en production
server.servlet.session.cookie.secure=true

# Proxy de confiance pour la piste d'audit (adresse du reverse-proxy)
security.audit.trusted-proxies=${AUDIT_TRUSTED_PROXIES:127.0.0.1,::1}
