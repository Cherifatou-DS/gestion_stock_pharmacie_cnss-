<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="header" class="app-header navbar navbar-expand navbar-dark navbar-primary">
    <div class="container-fluid">
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button" aria-label="Basculer le menu">
                    <i class="bi bi-list"></i>
                </a>
            </li>
            <li class="nav-item d-none d-md-block">
                <a th:href="@{/dashboard}" class="nav-link">Accueil</a>
            </li>
        </ul>

        <ul class="navbar-nav ms-auto">
            <li class="nav-item d-none d-md-block">
                <span class="nav-link text-white-50">
                    <i class="bi bi-building me-1"></i>
                    <span sec:authentication="principal.entityName">Structure</span>
                </span>
            </li>
            <li class="nav-item">
                <span class="nav-link">
                    <i class="bi bi-person-circle me-1"></i>
                    <span sec:authentication="principal.fullName">Utilisateur</span>
                    <span class="badge bg-navy ms-1" sec:authentication="principal.role">ADMIN</span>
                </span>
            </li>
            <li class="nav-item">
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="nav-link btn btn-link text-decoration-none">
                        <i class="bi bi-box-arrow-right me-1"></i>Déconnexion
                    </button>
                </form>
            </li>
        </ul>
    </div>
</nav>
</body>
</html>
