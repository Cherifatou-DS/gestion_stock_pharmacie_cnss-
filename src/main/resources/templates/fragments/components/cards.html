<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="info-box(icon, bgClass, title, value)" th:class="'small-box ' + ${bgClass}">

        <h3 th:text="${value}">0</h3>
        <p th:text="${title}">Titre</p>
    </div>
    <div class="small-box-icon">

    </div>
</div>
</body>
</html>
