<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main-layout}">
<head>
    <title th:text="${entityForm.id != null} ? 'Structure - ' + ${entityForm.code} : 'Structure - Nouvelle entité'">Structure - Nouvelle entité</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="h5 mb-3">
        <i class="bi bi-hospital me-2"></i>
        <span th:text="${entityForm.id != null} ? 'Modifier la structure ' + ${entityForm.code} : 'Nouvelle structure'">Nouvelle structure</span>
    </h2>

    <div th:replace="~{fragments/components/alerts :: alert-danger(${error})}"></div>

    <div class="card card-white shadow-sm">
        <div class="card-header">
            <h3 class="card-title">Informations de la structure</h3>
        </div>
        <div class="card-body">
            <form th:action="${entityForm.id != null} ? @{/entities/{id}/edit(id=${entityForm.id})} : @{/entities}"
                  th:object="${entityForm}" method="post" novalidate>
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label" for="code">Code <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="code" th:field="*{code}"
                               placeholder="CM03" maxlength="20" required
                               th:readonly="${readonly}">
                        <div class="text-danger small" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
                        <div class="form-text">Unique, lettres et chiffres uniquement (converti en majuscules).</div>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label" for="name">Nom <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="name" th:field="*{name}"
                               placeholder="Centre Médical 3" maxlength="100" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="type">Type <span class="text-danger">*</span></label>
                        <select id="type" th:field="*{type}" class="form-select" required>
                            <option value="">-- Sélectionner --</option>
                            <option th:each="entry : ${structureTypes}" th:value="${entry.key}"
                                    th:text="${entry.value}">Centre Médical</option>
                        </select>
                        <div class="text-danger small" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></div>
                    </div>
                </div>

                <div class="mt-4 d-flex justify-content-end gap-2">
                    <a th:href="@{/entities}" class="btn btn-secondary">Annuler</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-1"></i>
                        <span th:text="${entityForm.id != null} ? 'Enregistrer les modifications' : 'Créer la structure'">Créer la structure</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
