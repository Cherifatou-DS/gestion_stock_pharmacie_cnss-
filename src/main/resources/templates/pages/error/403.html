<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main-layout}">
<head>
    <title>Accès refusé</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex align-items-center justify-content-center" style="min-height: 50vh;">
        <div class="card card-white shadow-sm text-center" style="width: 420px; border-top: 4px solid #dc3545;">
            <div class="card-body py-5">
                <i class="fas fa-ban fa-3x mb-3" style="color: #dc3545;"></i>
                <h1 class="h4">403 - Accès refusé</h1>
                <p class="text-muted">Votre rôle ne permet pas d'accéder à cette ressource.</p>
                <a th:href="@{/dashboard}" class="btn btn-primary">
                    <i class="fas fa-tachometer-alt me-1"></i>Retour au tableau de bord
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
