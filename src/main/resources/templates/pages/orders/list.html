<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main-layout}">
<head>
    <title>Commandes</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h5 mb-0"><i class="bi bi-cart3 me-2"></i>Circuit des Commandes</h2>
        <a th:href="@{/orders/new}" class="btn btn-primary">
            <i class="bi bi-plus-circle me-1"></i>Nouvelle commande
        </a>
    </div>

    <div th:replace="~{fragments/components/alerts :: alert-success(${message})}"></div>

    <!-- Filtres -->
    <div class="card card-white shadow-sm mb-3">
        <div class="card-body py-2">
            <form th:action="@{/orders}" method="get" class="row g-2 align-items-end">
                <div class="col-md-4" th:if="${!restricted}">
                    <label class="form-label mb-0 small" for="sourceEntityId">Structure émettrice</label>
                    <select id="sourceEntityId" name="sourceEntityId" class="form-select form-select-sm">
                        <option value="">Toutes les structures</option>
                        <option th:each="entity : ${entities}" th:value="${entity.id}"
                                th:text="${entity.code + ' - ' + entity.name}"
                                th:selected="${entity.id == selectedSourceEntityId}">CM01</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label mb-0 small" for="status">Statut</label>
                    <select id="status" name="status" class="form-select form-select-sm">
                        <option value="">Tous les statuts</option>
                        <option th:each="orderStatus : ${statuses}" th:value="${orderStatus.name()}"
                                th:text="${orderStatus.label}"
                                th:selected="${orderStatus.name() == selectedStatus}">BROUILLON</option>
                    </select>
                </div>
                <div class="col-md-4 text-end">
                    <button type="submit" class="btn btn-sm btn-primary">
                        <i class="bi bi-funnel me-1"></i>Filtrer
                    </button>
                    <a th:href="@{/orders}" class="btn btn-sm btn-secondary">Réinitialiser</a>
                </div>
            </form>
        </div>
    </div>

    <div class="card card-white shadow-sm">
        <div class="card-body">
            <table id="orders-table" class="table table-bordered table-striped align-middle w-100">
                <thead>
                <tr>
                    <th>N° Commande</th>
                    <th>Émetteur</th>
                    <th>Destinataire</th>
                    <th>Circuit</th>
                    <th>Statut</th>
                    <th>Créée par</th>
                    <th>Date</th>
                    <th class="text-center" style="width: 90px;">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="order : ${orders}">
                    <td><span class="badge bg-navy" th:text="${order.orderNumber}">CMD-2026-0001</span></td>
                    <td>
                        <span class="badge bg-navy" th:text="${order.sourceEntityCode}">CM01</span>
                        <span class="small text-muted" th:text="${order.sourceEntityName}">Centre Médical 1</span>
                    </td>
                    <td>
                        <span class="badge bg-navy" th:text="${order.targetEntityCode}">PC</span>
                        <span class="small text-muted" th:text="${order.targetEntityName}">Pharmacie Centrale</span>
                    </td>
                    <td class="small">
                        <span th:if="${order.requiresDbiValidation}" class="text-danger">
                            <i class="bi bi-shield-exclamation me-1"></i>Validation DBI
                        </span>
                        <span th:unless="${order.requiresDbiValidation}" class="text-primary">
                            <i class="bi bi-lightning me-1"></i>Direct (sans DBI)
                        </span>
                    </td>
                    <td th:replace="~{fragments/components/badges :: order-status-badge(${order.status})}">STATUT</td>
                    <td class="small" th:text="${order.createdByName}">Admin CNSS</td>
                    <td class="small" th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}">13/11/2026</td>
                    <td class="text-center">
                        <a th:href="@{/orders/{id}(id=${order.id})}" class="btn btn-sm btn-primary" title="Détail">
                            <i class="bi bi-eye"></i>
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(orders)}">
                    <td colspan="8" class="text-center text-muted py-4">Aucune commande enregistrée.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script layout:fragment="scripts" th:inline="none">
    $(function () {
        $('#orders-table').DataTable({
            language: {
                url: '/plugins/datatables/i18n/fr-FR.json'
            },
            responsive: true,
            pageLength: 10,
            lengthMenu: [[10, 25, 50, -1], [10, 25, 50, 'Tous']],
            order: [[0, 'desc']]
        });
    });
</script>
</body>
</html>
