<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main-layout}">
<head>
    <title>Commandes Fournisseurs</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h5 mb-0"><i class="bi bi-cart3 me-2"></i>Commandes Fournisseurs <span class="badge bg-danger">DAAS</span></h2>
        <a th:href="@{/orders/new}" class="btn btn-primary">
            <i class="bi bi-plus-circle me-1"></i>Nouvelle commande
        </a>
    </div>

    <div th:replace="~{fragments/components/alerts :: alert-success(${message})}"></div>

    <!-- Filtres -->
    <div class="card card-white shadow-sm mb-3">
        <div class="card-body py-2">
            <form th:action="@{/orders}" method="get" class="row g-2 align-items-end">
                <div class="col-md-4">
                    <label class="form-label mb-0 small" for="supplierEntityId">Fournisseur</label>
                    <select id="supplierEntityId" name="supplierEntityId" class="form-select form-select-sm">
                        <option value="">Tous les fournisseurs</option>
                        <option th:each="supplier : ${suppliers}" th:value="${supplier.id}"
                                th:text="${supplier.code + ' - ' + supplier.name}"
                                th:selected="${supplier.id == selectedSupplierEntityId}">FRN01</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label mb-0 small" for="status">Statut</label>
                    <select id="status" name="status" class="form-select form-select-sm">
                        <option value="">Tous les statuts</option>
                        <option th:each="orderStatus : ${statuses}" th:value="${orderStatus.name()}"
                                th:text="${orderStatus.label}"
                                th:selected="${orderStatus.name() == selectedStatus}">BROUILLON</option>
                    </select>
                </div>
                <div class="col-md-4 text-end">
                    <button type="submit" class="btn btn-sm btn-primary">
                        <i class="bi bi-funnel me-1"></i>Filtrer
                    </button>
                    <a th:href="@{/orders}" class="btn btn-sm btn-secondary">Réinitialiser</a>
                </div>
            </form>
        </div>
    </div>

    <div class="card card-white shadow-sm">
        <div class="card-body">
            <table id="orders-table" class="table table-bordered table-striped align-middle w-100">
                <thead>
                <tr>
                    <th>N° Commande</th>
                    <th>Émetteur</th>
                    <th>Fournisseur</th>
                    <th>Réception</th>
                    <th class="text-end">Montant</th>
                    <th>Statut</th>
                    <th>Créée par</th>
                    <th class="text-center" style="width: 90px;">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="order : ${orders}">
                    <td>
                        <span class="badge bg-navy" th:text="${order.orderNumber}">CMD-2026-0001</span>
                        <div class="small text-muted" th:if="${order.supplyRequestNumber != null}"
                             th:text="'Demande ' + ${order.supplyRequestNumber}">DEM-2026-0001</div>
                    </td>
                    <td>
                        <span class="badge bg-navy" th:text="${order.sourceEntityCode}">DAAS</span>
                        <span class="small text-muted" th:text="${order.sourceEntityName}">DAAS</span>
                    </td>
                    <td>
                        <span class="badge bg-navy" th:text="${order.supplierEntityCode}">FRN01</span>
                        <span class="small text-muted" th:text="${order.supplierEntityName}">Fournisseur Principal</span>
                    </td>
                    <td>
                        <span class="badge bg-navy" th:text="${order.receivingEntityCode}">DC</span>
                        <span class="small text-muted" th:text="${order.receivingEntityName}">Dépôt Central</span>
                    </td>
                    <td class="text-end"
                        th:text="${#numbers.formatDecimal(order.totalAmount != null ? order.totalAmount : 0, 1, 'WHITESPACE', 2, 'COMMA')} + ' F'">0,00 F</td>
                    <td th:replace="~{fragments/components/badges :: order-status-badge(${order.status})}">STATUT</td>
                    <td class="small" th:text="${order.createdByName}">Agent DAAS</td>
                    <td class="text-center">
                        <a th:href="@{/orders/{id}(id=${order.id})}" class="btn btn-sm btn-primary" title="Détail">
                            <i class="bi bi-eye"></i>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script layout:fragment="scripts" th:inline="none">
    $(function () {
        $('#orders-table').DataTable({
            language: {
                url: '/plugins/datatables/i18n/fr-FR.json',
                emptyTable: 'Aucune commande fournisseur enregistrée.'
            },
            responsive: true,
            pageLength: 10,
            lengthMenu: [[10, 25, 50, -1], [10, 25, 50, 'Tous']],
            order: [[0, 'desc']]
        });
    });
</script>
</body>
</html>
