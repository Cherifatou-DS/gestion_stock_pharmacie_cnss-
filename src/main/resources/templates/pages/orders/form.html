<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main-layout}">
<head>
    <title>Commande - Nouvelle demande</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="h5 mb-3"><i class="bi bi-cart-plus me-2"></i>Nouvelle commande</h2>

    <div th:replace="~{fragments/components/alerts :: alert-danger(${error})}"></div>

    <div class="card card-white shadow-sm">
        <div class="card-header">
            <h3 class="card-title">Informations de la commande</h3>
        </div>
        <div class="card-body">
            <form th:action="@{/orders}" th:object="${orderForm}" method="post" novalidate>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label" for="targetEntityId">Destinataire <span class="text-danger">*</span></label>
                        <select id="targetEntityId" th:field="*{targetEntityId}" class="form-select" required>
                            <option value="">-- Sélectionner --</option>
                            <option th:each="entity : ${allowedTargets}" th:value="${entity.id}"
                                    th:text="${entity.code + ' - ' + entity.name}">PC</option>
                        </select>
                        <div class="text-danger small" th:if="${#fields.hasErrors('targetEntityId')}"
                             th:errors="*{targetEntityId}"></div>
                        <div class="form-text">
                            CM → PC : livraison directe si stock disponible (sans DBI).
                            Réapprovisionnement : validation DBI obligatoire.
                        </div>
                    </div>
                </div>

                <h4 class="h6 mt-4 mb-2 border-bottom pb-2">Lignes de produits</h4>
                <div id="order-lines">
                    <div class="row g-2 align-items-center mb-2 line-row" th:each="line, stat : *{lines}">
                        <div class="col-md-7">
                            <select class="form-select form-select-sm" th:name="|lines[${stat.index}].productId|" required>
                                <option value="">-- Produit --</option>
                                <option th:each="product : ${products}" th:value="${product.id}"
                                        th:text="${product.code + ' - ' + product.designation}">MED001</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <input type="number" min="1" class="form-control form-control-sm"
                                   th:name="|lines[${stat.index}].quantityRequested|"
                                   placeholder="Qté" required>
                        </div>
                        <div class="col-md-2">
                            <button type="button" class="btn btn-sm btn-danger remove-line" title="Supprimer la ligne">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="text-danger small mb-2" th:if="${#fields.hasErrors('lines')}" th:errors="*{lines}"></div>
                <button type="button" id="add-line" class="btn btn-sm btn-secondary mb-3">
                    <i class="bi bi-plus-lg me-1"></i>Ajouter une ligne
                </button>

                <div class="d-flex justify-content-end gap-2 border-top pt-3">
                    <a th:href="@{/orders}" class="btn btn-secondary">Annuler</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-1"></i>Créer la commande (Brouillon)
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script layout:fragment="scripts" th:inline="javascript">
    $(function () {
        // Ligne supprimée = neutralisée (select/quantité désactivés, valeur qté -> conservée hors envoi)
        $(document).on('click', '.remove-line', function () {
            const row = $(this).closest('.line-row');
            if ($('.line-row').length > 1) {
                row.remove();
            } else {
                row.find('select').val('');
                row.find('input').val('');
            }
        });

        $('#add-line').on('click', function () {
            const $rows = $('#order-lines .line-row');
            const $template = $rows.first();
            const $clone = $template.clone();
            const index = $rows.length;
            $clone.find('select').attr('name', 'lines[' + index + '].productId').val('');
            $clone.find('input').attr('name', 'lines[' + index + '].quantityRequested').val('');
            $clone.find('option').each(function () {
                $(this).prop('selected', $(this).is(':first-child'));
            });
            $('#order-lines').append($clone);
        });
    });
</script>
</body>
</html>
